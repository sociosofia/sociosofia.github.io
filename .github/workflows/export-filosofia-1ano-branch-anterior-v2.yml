name: Exportar reconstrução anterior de Filosofia do 1º ano

on:
  push:
    branches:
      - agent/reconstruir-filosofia-1ano-transversal-v2
    paths:
      - '.github/workflows/export-filosofia-1ano-branch-anterior-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recuperar a reconstrução anterior
        run: |
          git fetch origin agent/reconstruir-filosofia-1ano-v2
          mkdir -p tmp/filosofia-1ano-branch-anterior
          for file in v2-01.b64 v2-02.b64 v2-03-04.b64 v2-05-06.b64 v2-07-08.b64; do
            git show origin/agent/reconstruir-filosofia-1ano-v2:alunos/filosofia-1ano/$file > tmp/filosofia-1ano-branch-anterior/$file
          done
          git show origin/agent/reconstruir-filosofia-1ano-v2:alunos/filosofia-1ano/index.html > tmp/filosofia-1ano-branch-anterior/carregador.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          const base = 'tmp/filosofia-1ano-branch-anterior';
          const files = ['v2-01.b64','v2-02.b64','v2-03-04.b64','v2-05-06.b64','v2-07-08.b64'];
          const encoded = files.map(file => fs.readFileSync(`${base}/${file}`, 'utf8').replace(/\s+/g, '')).join('');
          const html = zlib.gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8');
          fs.writeFileSync(`${base}/filosofia-1ano-reconstrucao-anterior.html`, html);
          NODE
      - name: Publicar artefato diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: filosofia-1ano-branch-anterior-v2
          path: tmp/filosofia-1ano-branch-anterior
          if-no-files-found: error
          retention-days: 7
