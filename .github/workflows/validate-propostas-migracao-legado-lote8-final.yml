name: Validar propostas do lote final legado

on:
  push:
    branches:
      - migracao-editorial-legado-lote8-final-v1
    paths:
      - 'data/propostas-migracao-legado-lote8-final-v1.json'
      - 'data/aprovacoes-migracao-legado-lote8-final-v1.json'
      - 'data/publicacao-legado.json'
      - 'data/repertorios.json'
      - 'data/publicacoes.json'
      - 'data/repertorios-canonicos.json'
      - 'data/temas.json'
      - 'scripts/test-propostas-migracao-legado-lote8-final.mjs'
      - 'scripts/test-aprovacao-migracao-legado-lote8-final.mjs'
      - '.github/workflows/validate-propostas-migracao-legado-lote8-final.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/propostas-migracao-legado-lote8-final-v1.json'
      - 'data/aprovacoes-migracao-legado-lote8-final-v1.json'
      - 'data/publicacao-legado.json'
      - 'data/repertorios.json'
      - 'data/publicacoes.json'
      - 'data/repertorios-canonicos.json'
      - 'data/temas.json'
      - 'scripts/test-propostas-migracao-legado-lote8-final.mjs'
      - 'scripts/test-aprovacao-migracao-legado-lote8-final.mjs'
      - '.github/workflows/validate-propostas-migracao-legado-lote8-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxe e JSON
        run: |
          node --check scripts/test-propostas-migracao-legado-lote8-final.mjs
          node --check scripts/test-aprovacao-migracao-legado-lote8-final.mjs
          node -e "JSON.parse(require('fs').readFileSync('data/propostas-migracao-legado-lote8-final-v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/aprovacoes-migracao-legado-lote8-final-v1.json','utf8'))"
      - name: Validar lote final cultural
        run: node scripts/test-propostas-migracao-legado-lote8-final.mjs
      - name: Validar aprovação nominal
        run: node scripts/test-aprovacao-migracao-legado-lote8-final.mjs
