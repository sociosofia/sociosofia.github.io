name: Temporary TCM process endpoint mapper

on:
  push:
    branches:
      - tmp-tcm-process-endpoints

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-tcm-process-endpoints

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch process document lists
        run: |
          mkdir -p tmp/tcm-process
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import json, re, requests
          from bs4 import BeautifulSoup

          base='https://portal.tcm.sp.gov.br'
          page_url=base+'/ConsultaProcesso?NumeroTC=TC%2F003153%2F2023&buscaSimplificada=True'
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'X-Requested-With':'XMLHttpRequest',
              'Referer':page_url,
          })
          r=s.get(page_url,timeout=180)
          r.raise_for_status()
          root=Path('tmp/tcm-process')
          (root/'process.html').write_bytes(r.content)

          endpoints={
              'documentos_resolucao':'/ConsultaProcesso/CarregarListaDocumentosAnexosResolucao',
              'arquivos_eletronicos':'/ConsultaProcesso/CarregarListaDocumentosETCM',
              'tramitacao':'/ConsultaProcesso/CarregarTramitacao',
              'interessados':'/ConsultaProcesso/CarregarInteressados',
              'publicacoes':'/ConsultaProcesso/CarregarListaPublicacoesRelacionadas',
          }
          summary={}
          all_links=[]
          for name,path in endpoints.items():
              rr=s.post(urljoin(base,path),data={'nutc':'TC0031532023'},timeout=180)
              entry={'url':rr.url,'status':rr.status_code,'content_type':rr.headers.get('content-type'),'size':len(rr.content)}
              (root/f'{name}.raw').write_bytes(rr.content)
              try:
                  obj=rr.json()
                  entry['json']=obj
                  html=obj.get('renderHtml','') if isinstance(obj,dict) else ''
              except Exception:
                  html=rr.text
              (root/f'{name}.html').write_text(html or '',encoding='utf-8',errors='ignore')
              soup=BeautifulSoup(html or '','html.parser')
              links=[]
              for tag in soup.find_all(['a','button','form']):
                  item={'tag':tag.name,'text':' '.join(tag.get_text(' ',strip=True).split())[:1000]}
                  for attr in ['href','action','onclick','data-url','data-href','id','name','value','title']:
                      if tag.get(attr): item[attr]=tag.get(attr)
                  if len(item)>2 or item['text']:
                      links.append(item)
                      all_links.append({'source':name,**item})
              entry['links']=links
              entry['text']=' '.join(soup.get_text(' ',strip=True).split())[:20000]
              summary[name]=entry
          (root/'endpoint-results.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          (root/'document-links.json').write_text(json.dumps(all_links,ensure_ascii=False,indent=2),encoding='utf-8')

          # Human-readable index
          out=['# TC/003153/2023 — public document lists']
          for name,entry in summary.items():
              out.append(f'\n## {name}\n- status: {entry["status"]}\n- bytes: {entry["size"]}\n- text: {entry.get("text","")[:5000]}')
              for link in entry.get('links',[]):
                  out.append('- '+json.dumps(link,ensure_ascii=False))
          (root/'document-index.md').write_text('\n'.join(out),encoding='utf-8')
          print(json.dumps({k:{'status':v['status'],'size':v['size'],'links':len(v.get('links',[])),'text':v.get('text','')[:300]} for k,v in summary.items()},ensure_ascii=False,indent=2))
          PY

      - name: Commit temporary public outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/tcm-process
          git commit -m 'Retrieve public TCM process document lists' || exit 0
          git push origin HEAD:tmp-tcm-process-endpoints
