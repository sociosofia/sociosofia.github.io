name: Auditoria das páginas individuais

on:
  push:
    branches:
      - nucleo-elos-cards-v1
    paths:
      - 'repertorio.html'
      - 'detail.js'
      - 'detail-boot.js'
      - 'detail-identity-v1.css'
      - 'detail-paths-v1.css'
      - 'audit/detail-identity-audit.mjs'
      - '.github/workflows/detail-identity-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Validar sintaxe
        run: |
          node --check detail.js
          node --check detail-boot.js
          node --check audit/detail-identity-audit.mjs
      - name: Iniciar servidor
        run: |
          python3 -m http.server 8000 >/tmp/sociosofia-http.log 2>&1 &
          sleep 3
      - name: Auditar páginas individuais
        run: node audit/detail-identity-audit.mjs
      - name: Publicar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-paginas-individuais
          path: audit/output/detail-identity/
          retention-days: 14
