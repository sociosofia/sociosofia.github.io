name: Auditar home v2

on:
  push:
    branches:
      - home-triangulo-sobriedade-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Iniciar servidor local
        run: |
          python3 -m http.server 8000 > /tmp/sociosofia-http.log 2>&1 &
          echo $! > /tmp/sociosofia-http.pid
          sleep 2

      - name: Testar fluxos e gerar capturas
        run: |
          cat > /tmp/audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless: true});
          const results = [];

          async function audit(name, viewport) {
            const page = await browser.newPage({ viewportSize: viewport });
            const errors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push(`console: ${msg.text()}`);
            });
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));

            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'networkidle' });
            await page.screenshot({ path: `audit-${name}-fechada.png`, fullPage: true });

            const dado = page.locator('[data-entry-portal="dados"]');
            const conceito = page.locator('[data-entry-portal="conceitos"]');
            const painelDado = page.locator('.entry-panel[data-portal="dados"]');
            const painelConceito = page.locator('.entry-panel[data-portal="conceitos"]');

            await dado.click();
            await page.waitForTimeout(350);
            results.push({name, check:'dado abre', ok: await dado.getAttribute('aria-expanded') === 'true' && !(await painelDado.isHidden())});
            await page.screenshot({ path: `audit-${name}-dado.png`, fullPage: true });

            await dado.click();
            await page.waitForTimeout(200);
            results.push({name, check:'dado fecha no segundo clique', ok: await dado.getAttribute('aria-expanded') === 'false' && await painelDado.isHidden()});

            await conceito.click();
            await page.waitForTimeout(250);
            results.push({name, check:'conceito abre', ok: await conceito.getAttribute('aria-expanded') === 'true' && !(await painelConceito.isHidden())});
            await dado.click();
            await page.waitForTimeout(250);
            results.push({name, check:'abrir dado fecha conceito', ok: await conceito.getAttribute('aria-expanded') === 'false' && await painelConceito.isHidden()});

            const topic = page.locator('.entry-panel[data-portal="dados"] [data-theme]').first();
            await topic.click();
            await page.waitForTimeout(250);
            const activeAfterOpen = await topic.evaluate(el => el.classList.contains('active'));
            await topic.click();
            await page.waitForTimeout(250);
            const activeAfterClose = await topic.evaluate(el => el.classList.contains('active'));
            results.push({name, check:'subtema alterna abre/fecha', ok: activeAfterOpen && !activeAfterClose});

            const brandBox = await page.locator('.brand').boundingBox();
            const viewportTopGap = brandBox?.y ?? 0;
            results.push({name, check:'respiro antes da marca', ok: viewportTopGap >= (name === 'mobile' ? 12 : 16), value: viewportTopGap});

            const triangleBox = await page.locator('.entry-triangle').boundingBox();
            const titleBox = await page.locator('.section-entry .section-heading').boundingBox();
            const separated = Boolean(triangleBox && titleBox && triangleBox.y >= titleBox.y + titleBox.height + 12);
            results.push({name, check:'triângulo separado do título', ok: separated});

            results.push({name, check:'sem erros de console', ok: errors.length === 0, errors});
            await page.close();
          }

          await audit('desktop', {width: 1440, height: 1100});
          await audit('mobile', {width: 390, height: 844});
          await browser.close();

          fs.writeFileSync('auditoria-home-v2.json', JSON.stringify(results, null, 2));
          const failed = results.filter(item => !item.ok);
          console.log(JSON.stringify(results, null, 2));
          if (failed.length) {
            console.error(`Falharam ${failed.length} verificações.`);
            process.exit(1);
          }
          EOF
          node /tmp/audit.mjs

      - name: Publicar capturas e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-home-v2
          path: |
            audit-*.png
            auditoria-home-v2.json
          if-no-files-found: warn
          retention-days: 7
