name: Aplicar migração do terceiro lote legado

on:
  push:
    branches:
      - publicar-migracao-legado-lote3-v1
    paths:
      - 'scripts/aplicar-migracao-legado-lote3.mjs'
      - '.github/workflows/aplicar-migracao-legado-lote3.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publicar-migracao-legado-lote3-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar transformação determinística
        run: node scripts/aplicar-migracao-legado-lote3.mjs
      - name: Validar contratos após transformação
        run: |
          node scripts/validate-publicacoes.mjs
          node scripts/validate-repertorios-canonicos.mjs
      - name: Registrar arquivos gerados na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico-migracao-legado-lote3-v1.json data/publicacao-legado.json data/publicacoes.json data/repertorios-canonicos.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração a registrar."
          else
            git commit -m "Aplicar migração canônica do terceiro lote legado"
            git push origin HEAD:publicar-migracao-legado-lote3-v1
          fi
