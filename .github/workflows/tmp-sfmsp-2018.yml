name: Temporary SFMSP 2018 extraction

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe and extract 2018 annual accounts
        shell: bash
        run: |
          set +e
          mkdir -p sfmsp_2018_output
          URLS=(
            'https://www.saopaulo.sp.leg.br/iah/fulltext/contas/EXEC2018-BALANCO.pdf'
            'https://documentacao.saopaulo.sp.leg.br/iah/fulltext/contas/EXEC2018-BALANCO.pdf'
            'https://www.saopaulo.sp.leg.br/iah/fulltext/contas/EXEC2018-RELTCM.pdf'
            'https://documentacao.saopaulo.sp.leg.br/iah/fulltext/contas/EXEC2018-RELTCM.pdf'
          )
          : > sfmsp_2018_output/probe.txt
          i=0
          for url in "${URLS[@]}"; do
            i=$((i+1))
            out="/tmp/doc${i}.pdf"
            : > "$out"
            echo "=== $url ===" | tee -a sfmsp_2018_output/probe.txt
            code=$(curl -L -sS --retry 2 --connect-timeout 20 --max-time 180 -w '%{http_code}' -o "$out" "$url")
            bytes=$(stat -c%s "$out" 2>/dev/null || echo 0)
            echo "HTTP $code bytes $bytes" | tee -a sfmsp_2018_output/probe.txt
            file "$out" | tee -a sfmsp_2018_output/probe.txt
            if file "$out" | grep -qi PDF; then
              pdftotext -layout "$out" "/tmp/doc${i}.txt"
              echo '--- SFMSP/FUNERARIO MATCHES WITH CONTEXT ---' | tee -a sfmsp_2018_output/probe.txt
              grep -ainE -C 10 'SFMSP|SERVI.C?O FUNER.RIO|FUNER.RIO DO MUNIC.PIO' "/tmp/doc${i}.txt" | head -n 1600 | tee -a sfmsp_2018_output/probe.txt
              cp "/tmp/doc${i}.txt" "sfmsp_2018_output/doc${i}.txt"
            else
              head -c 500 "$out" | strings | tee -a sfmsp_2018_output/probe.txt
            fi
            echo | tee -a sfmsp_2018_output/probe.txt
          done
          exit 0
      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfmsp-2018-pdf-probe
          path: sfmsp_2018_output/
          retention-days: 1
