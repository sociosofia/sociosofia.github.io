name: Temporary SFMSP 2018 extraction

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Download and extract 2018 annual accounts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sfmsp_2018_output
          curl -L -sS --retry 3 --max-time 240 \
            'https://www.saopaulo.sp.leg.br/iah/fulltext/contas/EXEC2018-BALANCO.pdf' \
            -o sfmsp_2018_output/EXEC2018-BALANCO.pdf
          curl -L -sS --retry 3 --max-time 240 \
            'https://www.saopaulo.sp.leg.br/iah/fulltext/contas/EXEC2018-RELTCM.pdf' \
            -o sfmsp_2018_output/EXEC2018-RELTCM.pdf
          pdftotext -layout sfmsp_2018_output/EXEC2018-BALANCO.pdf sfmsp_2018_output/EXEC2018-BALANCO.txt
          pdftotext -layout sfmsp_2018_output/EXEC2018-RELTCM.pdf sfmsp_2018_output/EXEC2018-RELTCM.txt
          {
            echo '=== BALANCO MATCHES ==='
            grep -ainE -C 12 'SFMSP|SERVI.C?O FUNER.RIO|FUNER.RIO DO MUNIC.PIO' sfmsp_2018_output/EXEC2018-BALANCO.txt | head -n 2500 || true
            echo '=== RELTCM MATCHES ==='
            grep -ainE -C 12 'SFMSP|SERVI.C?O FUNER.RIO|FUNER.RIO DO MUNIC.PIO' sfmsp_2018_output/EXEC2018-RELTCM.txt | head -n 2500 || true
          } > sfmsp_2018_output/matches.txt
          wc -c sfmsp_2018_output/*
      - name: Upload extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfmsp-2018-pdfs-and-text
          path: sfmsp_2018_output/
          retention-days: 1
