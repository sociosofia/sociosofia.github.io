name: Temporary SFMSP 2018 extraction

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract matching rows from official TCM open data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sfmsp_2018_output
          REV='https://iris.tcm.sp.gov.br/assets/data/receita/csvReceita2018.csv'
          EMP='https://iris.tcm.sp.gov.br/assets/data/empenho/Empenho2018.csv'
          curl -L --retry 3 --connect-timeout 30 --max-time 240 "$REV" -o /tmp/receita.csv
          curl -L --retry 3 --connect-timeout 30 --max-time 360 "$EMP" -o /tmp/empenho.csv
          {
            echo '=== FILE SIZES ==='
            wc -c /tmp/receita.csv /tmp/empenho.csv
            echo '=== RECEITA HEADER ==='
            head -n 1 /tmp/receita.csv
            echo '=== RECEITA MATCHES ==='
            grep -aiE 'funer|SFMSP' /tmp/receita.csv || true
            echo '=== EMPENHO HEADER ==='
            head -n 1 /tmp/empenho.csv
            echo '=== EMPENHO MATCH COUNT ==='
            grep -aicE 'funer|SFMSP' /tmp/empenho.csv || true
            echo '=== EMPENHO MATCHES FIRST 500 ==='
            grep -aiE 'funer|SFMSP' /tmp/empenho.csv | head -n 500 || true
          } | tee sfmsp_2018_output/extraction.txt
          head -n 1 /tmp/receita.csv > sfmsp_2018_output/receita_sfmsp.csv
          grep -aiE 'funer|SFMSP' /tmp/receita.csv >> sfmsp_2018_output/receita_sfmsp.csv || true
          head -n 1 /tmp/empenho.csv > sfmsp_2018_output/empenho_sfmsp.csv
          grep -aiE 'funer|SFMSP' /tmp/empenho.csv >> sfmsp_2018_output/empenho_sfmsp.csv || true
      - name: Upload extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfmsp-2018-output-fast
          path: sfmsp_2018_output/
          retention-days: 1
