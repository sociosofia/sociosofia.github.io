name: Validar publicações públicas

on:
  push:
    branches:
      - main
      - contrato-automacao-publicacao-v1
      - piloto-migracao-legado-v1
    paths:
      - 'data/publicacoes.json'
      - 'data/repertorios.json'
      - 'data/publicacao-legado.json'
      - 'data/propostas-migracao-legado-lote1-v1.json'
      - 'data/temas.json'
      - 'schemas/card-dados-publico-v1.schema.json'
      - 'publication-contract.mjs'
      - 'scripts/validate-publicacoes.mjs'
      - 'scripts/test-publication-contract.mjs'
      - 'scripts/inserir-publicacao.mjs'
      - 'scripts/test-inserir-publicacao.mjs'
      - 'scripts/test-legado-publico.mjs'
      - '.github/workflows/validate-publicacoes.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/publicacoes.json'
      - 'data/repertorios.json'
      - 'data/publicacao-legado.json'
      - 'data/propostas-migracao-legado-lote1-v1.json'
      - 'data/temas.json'
      - 'schemas/card-dados-publico-v1.schema.json'
      - 'publication-contract.mjs'
      - 'scripts/validate-publicacoes.mjs'
      - 'scripts/test-publication-contract.mjs'
      - 'scripts/inserir-publicacao.mjs'
      - 'scripts/test-inserir-publicacao.mjs'
      - 'scripts/test-legado-publico.mjs'
      - '.github/workflows/validate-publicacoes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxe
        run: |
          node --check publication-contract.mjs
          node --check scripts/validate-publicacoes.mjs
          node --check scripts/test-publication-contract.mjs
          node --check scripts/inserir-publicacao.mjs
          node --check scripts/test-inserir-publicacao.mjs
          node --check scripts/test-legado-publico.mjs
          node -e "JSON.parse(require('fs').readFileSync('schemas/card-dados-publico-v1.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/publicacao-legado.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/propostas-migracao-legado-lote1-v1.json','utf8'))"
      - name: Validar publicações e temas
        run: node scripts/validate-publicacoes.mjs
      - name: Testar bloqueios editoriais
        run: node scripts/test-publication-contract.mjs
      - name: Testar inserção segura
        run: node scripts/test-inserir-publicacao.mjs
      - name: Testar publicação transitória do legado
        run: node scripts/test-legado-publico.mjs
