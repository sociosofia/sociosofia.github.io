name: Aplicar migração do quarto lote legado

on:
  push:
    branches:
      - publicar-migracao-legado-lote4-v1
    paths:
      - 'scripts/aplicar-migracao-legado-lote4.mjs'
      - '.github/workflows/aplicar-migracao-legado-lote4.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publicar-migracao-legado-lote4-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar migração e validar contratos
        run: node scripts/aplicar-migracao-legado-lote4.mjs
      - name: Registrar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico-migracao-legado-lote4-v1.json data/publicacao-legado.json data/publicacoes.json data/repertorios-canonicos.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração a registrar."
          else
            git commit -m "Aplicar quarto lote migrado"
            git push origin HEAD:publicar-migracao-legado-lote4-v1
          fi
