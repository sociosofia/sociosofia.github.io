name: Auditoria da navegação geral

on:
  push:
    branches:
      - navegacao-site-geral-v1
    paths:
      - 'index.html'
      - 'sobre.html'
      - 'repertorio.html'
      - 'guia.html'
      - 'editoria2/index.html'
      - 'about-v1.css'
      - 'site-navigation-v1.css'
      - 'audit/site-general-navigation-audit.mjs'
      - '.github/workflows/site-general-navigation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Validar sintaxe
        run: node --check audit/site-general-navigation-audit.mjs
      - name: Iniciar servidor
        run: |
          python3 -m http.server 8000 >/tmp/sociosofia-http.log 2>&1 &
          sleep 3
      - name: Auditar navegação
        run: node audit/site-general-navigation-audit.mjs
