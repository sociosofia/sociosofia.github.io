name: Preparar validações do quinto lote legado

on:
  push:
    branches:
      - publicar-migracao-legado-lote5-v1
    paths:
      - 'scripts/preparar-validacoes-legado-lote5.mjs'
      - 'scripts/disparar-validacoes-lote5.txt'

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publicar-migracao-legado-lote5-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Atualizar testes cumulativos
        run: node scripts/preparar-validacoes-legado-lote5.mjs
      - name: Registrar validações permanentes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-legado-publico.mjs scripts/test-repertory-contract.mjs scripts/test-migracao-legado-lote1.mjs scripts/test-migracao-legado-lote2.mjs scripts/test-migracao-legado-lote3.mjs scripts/test-migracao-legado-lote4.mjs scripts/test-migracao-legado-lote5.mjs scripts/test-propostas-migracao-legado-lote4.mjs scripts/test-propostas-migracao-legado-lote5.mjs scripts/test-aprovacao-migracao-legado-lote5.mjs audit/legacy-publication-browser.mjs .github/workflows/validate-migracao-legado-lote5.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração a registrar."
          else
            git commit -m "Atualizar validações após o quinto lote"
            git push origin HEAD:publicar-migracao-legado-lote5-v1
          fi
