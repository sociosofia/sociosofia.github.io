name: Auditoria de fechamento SESI Rio Claro

on:
  pull_request:
    branches: [main]
    paths:
      - 'alunos/**'
      - 'audit/**'
      - '.github/workflows/sesi-rc-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar ferramentas
        run: |
          npm init -y
          npm install playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Iniciar servidor local
        run: |
          python3 -m http.server 8000 > /tmp/sociosofia-server.log 2>&1 &
          sleep 3
      - name: Ajustar verificações do auditor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('audit/sesi-rc-audit.mjs')
          text=path.read_text()
          text=text.replace("waitForSelector('#site-data',{timeout:30000})","waitForSelector('#site-data',{state:'attached',timeout:30000})")
          text=text.replace("const movementIds=data.chapters.flatMap(c=>c.movements.map(m=>m.id));\n    if(new Set(movementIds).size!==movementIds.length) addFailure(result,'Há IDs de movimentos duplicados.');","for(const chapter of data.chapters){const movementIds=chapter.movements.map(m=>m.id);if(new Set(movementIds).size!==movementIds.length)addFailure(result,`Há IDs de movimentos duplicados no capítulo ${chapter.number}.`);}")
          text=text.replace("const drawerText=await page.locator('#drawer').innerText();","const drawerText=await page.locator('#drawer').textContent();")
          text=text.replace("const query=target.subject==='Filosofia'?'Kant':'Marx';","const query=Object.values(data.entities)[0]?.title||target.subject;")
          path.write_text(text)
          PY
      - name: Executar auditoria
        run: node audit/sesi-rc-audit.mjs
      - name: Publicar relatório e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-sesi-rio-claro
          path: audit/output/
          retention-days: 14
