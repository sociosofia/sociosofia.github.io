name: Validar Filosofia do 1º ano

on:
  push:
    branches:
      - agent/publicar-filosofia-1ano-anual-v1
    paths:
      - 'alunos/filosofia-1ano/**'
      - 'audit/filosofia-1ano-publicacao-v1.json'
      - 'docs/fechamento-filosofia-1ano-v1.md'
      - 'scripts/test-filosofia-1ano-anual-v1.mjs'
      - '.github/workflows/validate-filosofia-1ano-anual-v1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'alunos/filosofia-1ano/**'
      - 'audit/filosofia-1ano-publicacao-v1.json'
      - 'docs/fechamento-filosofia-1ano-v1.md'
      - 'scripts/test-filosofia-1ano-anual-v1.mjs'
      - '.github/workflows/validate-filosofia-1ano-anual-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxe do teste
        run: node --check scripts/test-filosofia-1ano-anual-v1.mjs
      - name: Validar percurso anual
        run: node scripts/test-filosofia-1ano-anual-v1.mjs
