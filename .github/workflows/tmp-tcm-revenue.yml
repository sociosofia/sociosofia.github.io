name: Temporary TCM revenue extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-tcm-revenue-api
      - name: Install dependencies
        run: python -m pip install pandas
      - name: Download and aggregate IRIS revenue files
        run: |
          mkdir -p tmp/tcm-revenue
          cat > /tmp/focus.py <<'PY'
          import io, re, json, unicodedata, urllib.request
          from pathlib import Path
          import pandas as pd
          outdir=Path('tmp/tcm-revenue')
          def norm(x):
              s=unicodedata.normalize('NFKD',str(x)).encode('ascii','ignore').decode('ascii').upper()
              return re.sub(r'\s+',' ',s)
          def money(s):
              s=str(s).strip()
              if not s or s=='.00': return 0.0
              try: return float(s.replace('.','',s.count('.')-1))
              except: 
                  try: return float(s.replace(',','.'))
                  except: return 0.0
          entities=['CONSOLARE','CORTEL','GRUPO MAYA','VELAR','PREVER ADMINISTRACAO CEMITERIAL','SP REGULA','44.615.216','47.701.152','48.222.338','47.863.166','53/SFMSP/2022','54/SFMSP/2022','55/SFMSP/2022','60/SFMSP/2022']
          rows=[]; annual=[]; specific=[]; legacy=[]
          for year in range(2023,2027):
              url=f'https://iris.tcm.sp.gov.br/assets/data/receita/csvReceita{year}.csv'
              raw=urllib.request.urlopen(url,timeout=120).read()
              for enc in ('utf-8-sig','latin1','cp1252'):
                  try: text=raw.decode(enc); break
                  except UnicodeDecodeError: pass
              sep=';' if '\n'.join(text.splitlines()[:5]).count(';') >= '\n'.join(text.splitlines()[:5]).count(',') else ','
              df=pd.read_csv(io.StringIO(text),sep=sep,dtype=str,keep_default_na=False,low_memory=False)
              joined=df.astype(str).agg(' | '.join,axis=1).map(norm)
              arrec_col=[c for c in df.columns if norm(c)=='ARRECADADO'][0]
              # Generic FMD concession outorga rubrica
              mask_fmd=joined.str.contains('OUTORGAS PROVENIENTES DE CONCESSOES - FMD',regex=False,na=False)
              fmd=df.loc[mask_fmd].copy()
              fmd['_valor']=pd.to_numeric(fmd[arrec_col].str.replace(',','.',regex=False),errors='coerce').fillna(0)
              annual.append({'year':year,'rows':len(fmd),'arrecadado_fmd':float(fmd['_valor'].sum())})
              for _,r in fmd.iterrows():
                  d={'year':year,'kind':'FMD'}; d.update(r.to_dict()); rows.append(d)
              # Exact entity/contract identifiers
              mask_ent=pd.Series(False,index=df.index)
              for e in entities: mask_ent |= joined.str.contains(norm(e),regex=False,na=False)
              for _,r in df.loc[mask_ent].iterrows():
                  d={'year':year,'kind':'ENTITY'}; d.update(r.to_dict()); specific.append(d)
              # Any cemetery/funeral descriptive rows excluding legacy SFMSP entity
              mask_cf=(joined.str.contains('CEMITER',regex=False,na=False)|joined.str.contains('FUNERAR',regex=False,na=False)|joined.str.contains('CREMAC',regex=False,na=False))
              mask_legacy=joined.str.contains('SERVICO FUNERARIO DO MUNICIPIO DE SAO PAULO',regex=False,na=False)
              for _,r in df.loc[mask_cf & ~mask_legacy].iterrows():
                  d={'year':year,'kind':'CEM_FUN'}; d.update(r.to_dict()); specific.append(d)
              leg=df.loc[mask_legacy].copy()
              leg['_valor']=pd.to_numeric(leg[arrec_col].str.replace(',','.',regex=False),errors='coerce').fillna(0)
              legacy.append({'year':year,'rows':len(leg),'arrecadado_sfm':float(leg['_valor'].sum())})
          pd.DataFrame(rows).to_csv(outdir/'fmd_rows.csv',index=False,sep=';',encoding='utf-8-sig')
          pd.DataFrame(specific).to_csv(outdir/'specific_rows.csv',index=False,sep=';',encoding='utf-8-sig')
          report=['# Resultado focado — API de Receita IRIS/TCMSP','', '## Rubrica agregada “Outorgas provenientes de concessões — FMD”']
          for a in annual: report.append(f"- {a['year']}: {a['rows']} linhas mensais; arrecadado somado = R$ {a['arrecadado_fmd']:,.2f}")
          report += ['', '## Linhas com nomes, CNPJs ou contratos das quatro concessionárias', f'- Total encontrado: {sum(1 for r in specific if r.get("kind")=="ENTITY")}']
          for r in [x for x in specific if x.get('kind')=='ENTITY'][:100]:
              vals=' | '.join(f'{k}={v}' for k,v in r.items() if str(v).strip())
              report.append('- '+vals)
          report += ['', '## Outras linhas contendo “cemitério”, “funerário” ou “cremação”, excluído o SFMSP residual', f'- Total encontrado: {sum(1 for r in specific if r.get("kind")=="CEM_FUN")}']
          for r in [x for x in specific if x.get('kind')=='CEM_FUN'][:100]:
              vals=' | '.join(f'{k}={v}' for k,v in r.items() if str(v).strip())
              report.append('- '+vals)
          report += ['', '## Receitas residuais classificadas na entidade SFMSP']
          for a in legacy: report.append(f"- {a['year']}: {a['rows']} linhas; arrecadado somado = R$ {a['arrecadado_sfm']:,.2f}")
          (outdir/'focused_summary.md').write_text('\n'.join(report),encoding='utf-8')
          print('\n'.join(report[:120]))
          PY
          python /tmp/focus.py
      - name: Commit focused results to temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/tcm-revenue/focused_summary.md tmp/tcm-revenue/fmd_rows.csv tmp/tcm-revenue/specific_rows.csv
          git commit -m 'Add focused IRIS concession revenue aggregation' || exit 0
          git push origin HEAD:tmp-tcm-revenue-api
      - uses: actions/upload-artifact@v4
        with:
          name: tcm-revenue-focused
          path: tmp/tcm-revenue
          retention-days: 1
