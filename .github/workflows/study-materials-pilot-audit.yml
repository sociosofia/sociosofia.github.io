name: Auditoria do piloto de materiais de estudo

on:
  pull_request:
    branches: [main]
    paths:
      - 'alunos/study-materials-*'
      - 'alunos/sociologia-2ano/index.html'
      - 'audit/study-materials-pilot-v2-audit.mjs'
      - '.github/workflows/study-materials-pilot-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar ferramentas
        run: |
          npm init -y
          npm install playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Iniciar servidor local
        run: |
          python3 -m http.server 8000 > /tmp/sociosofia-server.log 2>&1 &
          sleep 3
      - name: Executar auditoria
        run: node audit/study-materials-pilot-v2-audit.mjs
      - name: Publicar relatório e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-materiais-estudo-v2
          path: audit/output-study-materials-v2/
          retention-days: 14
