name: Aplicar migração do sexto lote legado

on:
  push:
    branches:
      - publicar-migracao-legado-lote6-v1
    paths:
      - 'scripts/aplicar-migracao-legado-lote6.mjs'
      - '.github/workflows/aplicar-migracao-legado-lote6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publicar-migracao-legado-lote6-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar migração atômica
        run: node scripts/aplicar-migracao-legado-lote6.mjs
      - name: Conferir arquivos gerados
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/historico-migracao-legado-lote6-v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/repertorios-canonicos.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/publicacao-legado.json','utf8'))"
          git diff --check
      - name: Registrar dados migrados
        run: |
          git config user.name sociosofia-bot
          git config user.email sociosofia-bot@users.noreply.github.com
          git add data/historico-migracao-legado-lote6-v1.json data/repertorios-canonicos.json data/publicacao-legado.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
          else
            git commit -m "Migrar sexto lote cultural para a base canônica"
            git push
          fi
