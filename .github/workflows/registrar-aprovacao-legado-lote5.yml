name: Registrar aprovação do quinto lote legado

on:
  push:
    branches:
      - migracao-editorial-legado-lote5-v1
    paths:
      - 'scripts/registrar-aprovacao-legado-lote5.mjs'
      - '.github/workflows/registrar-aprovacao-legado-lote5.yml'

permissions:
  contents: write

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracao-editorial-legado-lote5-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar aprovação editorial
        run: node scripts/registrar-aprovacao-legado-lote5.mjs
      - name: Registrar arquivos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/propostas-migracao-legado-lote5-v1.json docs/piloto-migracao-legado-lote5-v1.md scripts/test-propostas-migracao-legado-lote5.mjs scripts/test-aprovacao-migracao-legado-lote5.mjs .github/workflows/validate-propostas-migracao-legado-lote5.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração a registrar."
          else
            git commit -m "Registrar aprovação editorial do quinto lote"
            git push origin HEAD:migracao-editorial-legado-lote5-v1
          fi
