name: Temporary TCM public document downloader

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install browser and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Download through public browser session
        run: |
          mkdir -p tmp/tcm-browser
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright

          root=Path('tmp/tcm-browser')
          url='https://portal.tcm.sp.gov.br/ConsultaProcesso?NumeroTC=TC%2F003153%2F2023&buscaSimplificada=True'
          summary={'page_url':url,'downloads':[],'errors':[]}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(accept_downloads=True)
              page=context.new_page()
              page.goto(url,wait_until='domcontentloaded',timeout=180000)
              try:
                  page.get_by_text('Concordo',exact=True).click(timeout=5000)
              except Exception:
                  pass
              try:
                  page.locator('#iconShowDetalhe_TC0031532023').click(timeout=30000)
              except Exception as e:
                  summary['errors'].append('detail click: '+str(e))
              try:
                  page.locator('#btnCarregarDocumento_TC0031532023').click(timeout=30000)
                  page.wait_for_timeout(5000)
              except Exception as e:
                  summary['errors'].append('load list click: '+str(e))
              html=page.content(); (root/'page-after-clicks.html').write_text(html,encoding='utf-8')
              anchors=page.locator('#ListaDocumentosEtcm_TC0031532023 a').all()
              summary['anchor_count']=len(anchors)
              for i,a in enumerate(anchors):
                  try:
                      href=a.get_attribute('href')
                      text=a.inner_text()
                      if not href: continue
                      absolute=page.evaluate('(h)=>new URL(h, location.href).href',href)
                      item={'index':i,'text':text,'href':href,'absolute':absolute}
                      # Browser-context request shares cookies with the page.
                      resp=context.request.get(absolute,timeout=180000,fail_on_status_code=False)
                      body=resp.body()
                      item.update({'status':resp.status,'content_type':resp.headers.get('content-type'),'content_disposition':resp.headers.get('content-disposition'),'size':len(body)})
                      ext='pdf' if body.startswith(b'%PDF') else 'html'
                      path=root/f'document_{i}.{ext}'; path.write_bytes(body); item['path']=str(path)
                      summary['downloads'].append(item)
                  except Exception as e:
                      summary['errors'].append(f'anchor {i}: {e}')
              # Also request the two known public document IDs inside the same session.
              for name,cod in [('report',1945272),('response',1981587)]:
                  try:
                      direct=f'https://portal.tcm.sp.gov.br/ConsultaProcesso/DocumentoEtcm?nuProcesso=TC0031532023&codArquivoDigital={cod}'
                      resp=context.request.get(direct,timeout=180000,fail_on_status_code=False)
                      body=resp.body(); ext='pdf' if body.startswith(b'%PDF') else 'html'
                      path=root/f'{name}.{ext}'; path.write_bytes(body)
                      summary['downloads'].append({'name':name,'absolute':direct,'status':resp.status,'content_type':resp.headers.get('content-type'),'content_disposition':resp.headers.get('content-disposition'),'size':len(body),'path':str(path)})
                  except Exception as e:
                      summary['errors'].append(f'direct {name}: {e}')
              browser.close()
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

          for f in tmp/tcm-browser/*.pdf; do
            [ -e "$f" ] || continue
            pdftotext -layout "$f" "${f%.pdf}.txt" || true
            pdfinfo "$f" > "${f%.pdf}.pdfinfo.txt" || true
          done

      - name: Upload public documents
        uses: actions/upload-artifact@v4
        with:
          name: tcm-public-browser-files
          path: tmp/tcm-browser
          retention-days: 1
