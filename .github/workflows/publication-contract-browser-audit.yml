name: Auditar contrato no site

on:
  push:
    branches:
      - main
      - contrato-automacao-publicacao-v1
      - portao-publicado-legado-v1
      - publicar-migracao-legado-lote1-v1
    paths:
      - 'data/publicacoes.json'
      - 'data/repertorios.json'
      - 'data/repertorios-canonicos.json'
      - 'data/publicacao-legado.json'
      - 'data/temas.json'
      - 'publication-contract.mjs'
      - 'repertory-contract.mjs'
      - 'publication-feed.js'
      - 'site-shared.js'
      - 'detail.js'
      - 'audit/publication-contract-browser.mjs'
      - 'audit/legacy-publication-browser.mjs'
      - '.github/workflows/publication-contract-browser-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/publicacoes.json'
      - 'data/repertorios.json'
      - 'data/repertorios-canonicos.json'
      - 'data/publicacao-legado.json'
      - 'data/temas.json'
      - 'publication-contract.mjs'
      - 'repertory-contract.mjs'
      - 'publication-feed.js'
      - 'site-shared.js'
      - 'detail.js'
      - 'audit/publication-contract-browser.mjs'
      - 'audit/legacy-publication-browser.mjs'
      - '.github/workflows/publication-contract-browser-audit.yml'

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar navegador de teste
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Verificar sintaxe
        run: |
          node --check repertory-contract.mjs
          node --check publication-feed.js
          node --check audit/publication-contract-browser.mjs
          node --check audit/legacy-publication-browser.mjs
      - name: Iniciar servidor
        run: |
          python3 -m http.server 8000 >/tmp/sociosofia-http.log 2>&1 &
          sleep 3
      - name: Auditar renderização canônica
        run: node audit/publication-contract-browser.mjs
      - name: Auditar primeiro lote migrado
        run: node audit/legacy-publication-browser.mjs
