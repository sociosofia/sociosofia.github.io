<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sociosofia Alunos — percurso anual de Filosofia do 1º ano do ensino médio.">
  <title>Sociosofia Alunos — Filosofia, 1º ano</title>
  <style>
    :root{--paper:#F7F1E8;--ink:#292724;--muted:#706961;--terra:#9A6653;--teal:#4D6D6E;--yellow:#C8AE6D;--line:#D9CFC3;--card:#FFFDF9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
    main{width:min(620px,100%);padding:34px;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:0 18px 45px rgba(41,39,36,.08)}
    h1{margin:0 0 10px;color:var(--ink);font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.05em}
    p{color:var(--muted)}
    .loader{width:54px;height:54px;margin:24px auto 0;border:6px solid rgba(77,109,110,.16);border-top-color:var(--terra);border-radius:50%;animation:spin .8s linear infinite}
    a{color:var(--teal);font-weight:700}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.loader{animation:none}}
  </style>
</head>
<body>
  <main id="status" aria-live="polite">
    <h1>Sociosofia Alunos</h1>
    <p>Carregando Filosofia — 1º ano…</p>
    <div class="loader" aria-hidden="true"></div>
  </main>
  <script src="../accessibility-patch.js"></script>
  <script>
    (async()=>{
      try{
        if(!("DecompressionStream" in window))throw new Error("Este navegador não oferece suporte à descompressão da página.");
        const files=["v2-01.b64","v2-02.b64","v2-03-04.b64","v2-05-06.b64","v2-07-08.b64"];
        const parts=await Promise.all(files.map(async file=>{
          const response=await fetch(file,{cache:"force-cache"});
          if(!response.ok)throw new Error(`Falha ao carregar ${file}`);
          return(await response.text()).replace(/\s+/g,"");
        }));
        const raw=atob(parts.join(""));
        const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        let page=await new Response(stream).text();
        page=window.applySociosofiaAccessibilityPatch?.(page)||page;
        document.open();document.write(page);document.close();
      }catch(error){
        console.error(error);
        document.getElementById("status").innerHTML=`<h1>Não foi possível abrir o material.</h1><p>Tente atualizar a página. Persistindo o problema, volte à <a href="../index.html">Área do Estudante</a>.</p>`;
      }
    })();
  </script>
</body>
</html>
