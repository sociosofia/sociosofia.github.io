<dialog class="material-dialog" id="material-dialog"><div class="material-panel"><div class="material-head"><h2>Gerar revisão</h2><button class="dialog-close" id="material-close" type="button" aria-label="Fechar">×</button></div><div class="material-body"><p class="material-context">Selecione os capítulos da 1ª etapa.</p><div class="scope-list" id="scope-list"></div><div class="material-actions"><button id="material-cancel" type="button">Cancelar</button><button class="primary" id="material-generate" type="button">Gerar revisão</button></div></div></div></dialog>

<script>
(async()=>{
  try{
    const parts=Array.from({length:8},(_,i)=>`bundle-${String(i+1).padStart(2,'0')}.part`);
    const b64=(await Promise.all(parts.map(async path=>{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`${path}: ${r.status}`);return (await r.text()).trim()}))).join('');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const B=JSON.parse(await new Response(stream).text());
    if(B.version!=='v8-final-aprovada'||B.visual!=='v0.5-aprovado')throw new Error('Contrato canônico inesperado');
    const style=document.createElement('style');style.dataset.sociosofiaVisual='v0.5-aprovado';style.textContent=B.css;document.head.append(style);
    window.__SOCIOSOFIA_EDU_BUNDLE__=B;
    document.body.style.visibility='visible';
    const script=document.createElement('script');script.dataset.sociosofiaContent='v8-final-aprovada';script.textContent=B.app;document.body.append(script);
  }catch(error){
    console.error(error);document.body.innerHTML=`<div class="boot-error"><strong>Não foi possível carregar o Sociosofia EDU.</strong><br>${String(error.message||error)}</div>`;document.body.style.visibility='visible';
  }
})();
</script>
</body>
</html>
